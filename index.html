<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ratings Tracker</title>
<style>
body{font:14px system-ui,sans-serif;margin:0;padding:16px;background:#fafafa;color:#222}
h1{font-size:18px;margin:0 0 4px}.sub{color:#666;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{padding:6px 8px;border:1px solid #ccc;border-radius:6px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{padding:6px 8px;border-bottom:1px solid #eee;text-align:left}
th{background:#f0f0f0;position:sticky;top:0}a{color:#0b5fff}
@media(prefers-color-scheme:dark){body{background:#111;color:#eee}table{background:#1a1a1a}th{background:#262626}td,th{border-color:#333}input,select{background:#1a1a1a;color:#eee;border-color:#444}}
</style></head><body>
<h1>Ratings Tracker</h1><div class="sub" id="sub">Loading…</div>
<div class="bar"><input id="q" placeholder="Search company / industry"><select id="ag"><option value="">All agencies</option></select><select id="rt"><option value="">All ratings</option></select></div>
<table><thead><tr><th>Date</th><th>Agency</th><th>Company</th><th>Industry</th><th>Rating</th><th>Outlook</th><th>Rationale</th></tr></thead><tbody id="tb"></tbody></table>
<script>
let rows=[];
const $=id=>document.getElementById(id);
fetch("data/ratings.json?"+Date.now()).then(r=>r.json()).then(d=>{
  rows=d;
  $("sub").textContent=rows.length+" rationales · latest "+(rows[0]?rows[0].date:"–");
  for(const a of [...new Set(rows.map(r=>r.agency))].sort())$("ag").add(new Option(a,a));
  for(const a of [...new Set(rows.map(r=>r.rating).filter(Boolean))].sort())$("rt").add(new Option(a,a));
  draw();
});
function draw(){
  const q=$("q").value.toLowerCase(),a=$("ag").value,t=$("rt").value;
  const f=rows.filter(r=>(!a||r.agency===a)&&(!t||r.rating===t)&&(!q||(r.company+" "+r.industry).toLowerCase().includes(q))).slice(0,500);
  $("tb").innerHTML=f.map(r=>`<tr><td>${r.date}</td><td>${r.agency}</td><td>${esc(r.company)}</td><td>${esc(r.industry)}</td><td>${r.rating}</td><td>${r.outlook}</td><td>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">Open</a>`:""}</td></tr>`).join("");
}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
["q","ag","rt"].forEach(i=>$(i).addEventListener("input",draw));
</script></body></html>
