name: Daily rating update

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collectors
        run: |
          for a in crisil; do python $a.py || echo "$a failed"; done
      - name: Commit new data
        run: |
          git config user.name "rating-bot"
          git config user.email "rating-bot@users.noreply.github.com"
          git add ratings.json
          git diff --cached --quiet || (git commit -m "Daily update $(date -u +%F)" && git push)
